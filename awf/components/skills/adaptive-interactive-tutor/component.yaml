      "change_summary": "Upgrade `design-anti-goodhart` (`1.0.0-rc.23`), `html-ppt` (`1.0.0-rc.25` / wf `1.0.0-rc.22`), and `adaptive-interactive-tutor` (`1.0.0-rc.36`) to eliminate crude physical stick-doodles, single-gen AI image homogeneity, and text-guided blind-critic hallucinations across all 5 real-world length scales: (1) `audit_physical_entity_visual_fidelity` (`D5`) bans bare `<circle>`+`<line>` stick figures for any entity in `ATOM_ORBITAL`, `MOLECULE_SUPRAMOLECULE`, `NANO_PHASE_MORPHOLOGY`, `DEVICE_EXPERIMENT`, or `BIO_MACRO_SYSTEM`, enforcing sanctioned routes (`RDKIT_ACS_VECTOR`, `PYMOL_3D_RENDER`, `SHADED_25D_ENGINEERING_VECTOR`, `PRIMARY_PDF_FIGURE_CROP`, `EVOLUTIONARY_TEXTFREE_ILLUSTRATION_PLUS_SVG_CALLOUTS`); (2) `verify_evolutionary_image_tournament_ledger` (`D5` & `--verify-image-tournament`) mandates N>=4 text-free Gen-0 candidates across >=3 camera topologies & >=3 rendering media (prompt Jaccard <=0.55, Pillow 16x16 RGB L1 diversity) PLUS critique-guided `Gen-1+` iterative refinement with monotonic quality ratchet; and (3) `verify_two_stage_blind_object_recognition` (`D18` & `--verify-blind-object-recognition`) separates Stage A pure text-masked PNG blind identification (`text_masked_png_sha256 != full_slide_png_sha256`, blocking `LOW_AMBIGUOUS_GEOMETRY` / `T0_STICK_DOODLE` / `T1_FLAT_ICON` and leaked keywords) from Stage B full-slide bitmap text-purity & leader-line alignment checks."
